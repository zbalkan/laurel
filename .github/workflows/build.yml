on:
  push:
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  repair-selinux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: selinux-repair-run
          fetch-depth: 0
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -qq update
          sudo apt-get -qqy install build-essential libclang-dev libacl1-dev libselinux1-dev libsepol-dev secilc policycoreutils-python-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble candidate tree
        run: |
          git fetch origin selinux-why
          git show origin/selinux-why:src/selinux.rs > src/selinux.rs
          git show origin/selinux-why:.github/workflows/build.yml > .github/workflows/build.yml
          git show origin/selinux-why:build.rs > build.rs
          rm -f .github/workflows/selinux-repair-temp.yml
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/coalesce.rs',
              '        self.selinux.process(&mut ev);',
              '        self.selinux\n            .process(&mut ev, self.settings.enrich_prefix.as_deref());',
          )
          replace_once(
              'build.rs',
              '    println!("cargo:rustc-link-lib=sepol");\n    println!("cargo:rustc-link-lib=selinux");',
              '''    // audit2why uses libsepol's private service API. Those symbols are
    // intentionally omitted from libsepol.so but are available in libsepol.a,
    // just as upstream checkpolicy links the static archive. Ask the target C
    // compiler where that archive lives so this also works with cross toolchains.
    let compiler = cc::Build::new().get_compiler();
    let output = compiler
        .to_command()
        .arg("-print-file-name=libsepol.a")
        .output()
        .expect("failed to locate libsepol.a with the target C compiler");
    if !output.status.success() {
        panic!("target C compiler failed to locate libsepol.a");
    }
    let archive = String::from_utf8(output.stdout).expect("non-UTF-8 libsepol.a path");
    let archive = archive.trim();
    let archive = Path::new(archive);
    if !archive.is_file() {
        panic!(
            "SELinux support requires the static libsepol archive; compiler returned {}",
            archive.display()
        );
    }
    println!(
        "cargo:rustc-link-search=native={}",
        archive.parent().expect("libsepol.a has no parent").display()
    );
    println!("cargo:rustc-link-lib=static=sepol");
    println!("cargo:rustc-link-lib=dylib=selinux");''',
          )
          PY
      - name: Format and resolve lockfile
        run: |
          cargo fmt --all
          cargo check --features selinux
          cargo fmt --all --check
      - name: Compile differential-test policy
        run: secilc -o /tmp/laurel-selinux-policy tests/selinux-policy.cil
      - name: Test default build
        run: cargo test --locked
      - name: Test SELinux build against audit2why
        env:
          LAUREL_SELINUX_TEST_POLICY: /tmp/laurel-selinux-policy
        run: cargo test --locked --features selinux
      - name: Verify SELinux feature with Rust 1.70
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          cargo +1.70.0 test --locked --features selinux --no-run
      - name: Commit validated repair
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "selinux: finish integration fixes"
          git push origin HEAD:selinux-repair-run
